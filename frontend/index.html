          { meta: true, key: 'r' },      // Reload
          { meta: true, key: 'R' },      // Reload
          { meta: true, key: 'u' },      // View Source
          { meta: true, key: 'U' },      // View Source
          { meta: true, key: 'e' },      // Emoji
          { meta: true, key: 'E' },      // Emoji
          { meta: true, key: 'y' },      // History
          { meta: true, key: 'Y' }       // History
        ];

        document.addEventListener('keydown', (e) => {
          // Preskoči ako je u input, textarea ili contenteditable
          const tag = e.target.tagName.toLowerCase();
          if (tag === 'input' || tag === 'textarea' || e.target.isContentEditable) {
            return;
          }

          // Provjeri da li je pritisnuta zabranjena kombinacija
          for (const rule of forbiddenKeys) {
            let match = true;
            
            if (rule.ctrl !== undefined && e.ctrlKey !== rule.ctrl) match = false;
            if (rule.shift !== undefined && e.shiftKey !== rule.shift) match = false;
            if (rule.alt !== undefined && e.altKey !== rule.alt) match = false;
            if (rule.meta !== undefined && e.metaKey !== rule.meta) match = false;
            if (rule.key && e.key !== rule.key) match = false;

            if (match) {
              e.preventDefault();
              e.stopPropagation();
              return false;
            }
          }

          // Dodatna zaštita za F1-F12 (osim F5 za refresh)
          if (e.key.startsWith('F') && e.key !== 'F5') {
            const num = parseInt(e.key.replace('F', ''));
            if (num >= 1 && num <= 12) {
              e.preventDefault();
              return false;
            }
          }

          // Onemogući Ctrl+W (zatvaranje taba) - opciono
          if (e.ctrlKey && e.key === 'w') {
            e.preventDefault();
            return false;
          }

          // Onemogući Ctrl+Tab (switch tab) - opciono
          if (e.ctrlKey && e.key === 'Tab') {
            e.preventDefault();
            return false;
          }
        });

        // ============================================================
        // 3. ONEMOGUĆI SREDNJI KLIK
        // ============================================================
        document.addEventListener('mousedown', (e) => {
          if (e.button === 1) {
            e.preventDefault();
            return false;
          }
        });

        // ============================================================
        // 4. ONEMOGUĆI DRAG AND DROP
        // ============================================================
        document.addEventListener('dragstart', (e) => {
          e.preventDefault();
          return false;
        });

        // ============================================================
        // 5. ONEMOGUĆI SELEKTOVANJE TEKSTA (opciono)
        // ============================================================
        // document.addEventListener('selectstart', (e) => {
        //   e.preventDefault();

        // });

        // ============================================================
        // 6. ONEMOGUĆI PRINTANJE (Ctrl+P i beforeprint)
        // ============================================================
        window.addEventListener('beforeprint', (e) => {
          e.preventDefault();
          alert('🛡️ Printanje je onemogućeno!');
          return false;
        });

        document.addEventListener('keydown', (e) => {
          if (e.ctrlKey && e.key === 'p') {
            e.preventDefault();
            alert('🛡️ Printanje je onemogućeno!');
            return false;
          }
        });

        // ============================================================
        // 7. ONEMOGUĆI SAČUVAJ STRANICU (Ctrl+S)
        // ============================================================
        document.addEventListener('keydown', (e) => {
          if (e.ctrlKey && e.key === 's') {
            e.preventDefault();
            alert('🛡️ Sačuvaj stranicu je onemogućeno!');
            return false;
          }
        });

        // ============================================================
        // 8. DETEKCIJA DEVTOOLS (otvoren console)
        // ============================================================
        (function detectDevTools() {
          const element = new Image();
          Object.defineProperty(element, 'id', {
            get: function() {
              console.warn('🔍 DevTools detektovani!');
              // Možeš dodati akciju ako želiš
            }
          });
          console.log('%c', element);
        })();

        // ============================================================
        // 9. ONEMOGUĆI DESNI KLIK NA SLIKAMA
        // ============================================================
        document.addEventListener('mousedown', (e) => {
          if (e.target.tagName === 'IMG') {
            e.preventDefault();
            return false;
          }
        });

        // ============================================================
        // 10. ONEMOGUĆI KEYBOARD SHORTCUTS ZA COPY/PASTE
        // ============================================================
        document.addEventListener('copy', (e) => {
          e.preventDefault();
          return false;
        });

        document.addEventListener('cut', (e) => {
          e.preventDefault();
          return false;
        });

        // ============================================================
        // 11. ONEMOGUĆI DUGI KLIK (contextmenu na touch)
        // ============================================================
        document.addEventListener('touchstart', (e) => {
          if (e.target.tagName === 'IMG') {
            e.preventDefault();
            return false;
          }
        });

        // ============================================================
        // 12. ZAŠTITA OD SELECTION (tekst)
        // ============================================================
        const style = document.createElement('style');
        style.textContent = `
          body {
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
          }
          input, textarea, [contenteditable="true"] {
            -webkit-user-select: text;
            -moz-user-select: text;
            -ms-user-select: text;
            user-select: text;
          }
          img {
            -webkit-user-drag: none;
            user-drag: none;
          }
        `;
        document.head.appendChild(style);

        console.log('✅ Potpuna zaštita aktivirana!');
        console.log('🛡️ Onemogućeni: desni klik, sve prečice, DevTools, print, copy, cut, drag, selection.');
