    <!-- ⚡ KOMPLETNA ZAŠTITA – Desni klik, prečice, DevTools, print -->
    <!-- ============================================================ -->
    <script>
      (function() {
        console.log('🛡️ Aktiviranje potpune zaštite...');

        // ============================================================
        // 1. ONEMOGUĆI DESNI KLIK (svi elementi)
        // ============================================================
        document.addEventListener('contextmenu', function(e) {
          e.preventDefault();
          return false;
        });

        // ============================================================
        // 2. ONEMOGUĆI SVE PREČICE
        // ============================================================
        document.addEventListener('keydown', function(e) {
          // Zabranjene kombinacije
          const forbidden = [
            // F12 - DevTools
            { key: 'F12' },
            // Ctrl+U - View Source
            { ctrl: true, key: 'u' },
            { ctrl: true, key: 'U' },
            // Ctrl+S - Save
            { ctrl: true, key: 's' },
            { ctrl: true, key: 'S' },
            // Ctrl+P - Print
            { ctrl: true, key: 'p' },
            { ctrl: true, key: 'P' },
            // Ctrl+Shift+I - DevTools
            { ctrl: true, shift: true, key: 'I' },
            // Ctrl+Shift+J - Console
            { ctrl: true, shift: true, key: 'J' },
            // Ctrl+Shift+C - Inspect
            { ctrl: true, shift: true, key: 'C' },
            // Ctrl+Shift+R - Hard reload
            { ctrl: true, shift: true, key: 'R' },
            // Ctrl+Shift+U - View Source
            { ctrl: true, shift: true, key: 'U' },
            // Ctrl+Shift+S - Save as
            { ctrl: true, shift: true, key: 'S' },
            // Ctrl+Shift+P - Print
            { ctrl: true, shift: true, key: 'P' },
            // Ctrl+Shift+O - Open
            { ctrl: true, shift: true, key: 'O' },
            // Ctrl+Shift+T - Reopen tab
            { ctrl: true, shift: true, key: 'T' },
            // Ctrl+Shift+N - Incognito
            { ctrl: true, shift: true, key: 'N' },
            // Ctrl+Shift+W - Close window
            { ctrl: true, shift: true, key: 'W' },
            // Ctrl+Shift+Q - Quit
            { ctrl: true, shift: true, key: 'Q' },
            // Ctrl+Shift+F - Search
            { ctrl: true, shift: true, key: 'F' },
            // Ctrl+Shift+G - Find
            { ctrl: true, shift: true, key: 'G' },
            // Ctrl+Shift+H - History
            { ctrl: true, shift: true, key: 'H' },
            // Ctrl+Shift+K - Search
            { ctrl: true, shift: true, key: 'K' },
            // Ctrl+Shift+L - Address bar
            { ctrl: true, shift: true, key: 'L' },
            // Ctrl+Shift+M - Mute
            { ctrl: true, shift: true, key: 'M' },
            // Ctrl+Shift+V - Paste
            { ctrl: true, shift: true, key: 'V' },
            // Ctrl+Shift+Y - Redo
            { ctrl: true, shift: true, key: 'Y' },
            // Ctrl+Shift+Z - Redo
            { ctrl: true, shift: true, key: 'Z' },
            // Ctrl+Shift+B - Bookmarks
            { ctrl: true, shift: true, key: 'B' },
            // Ctrl+Shift+D - Bookmark
            { ctrl: true, shift: true, key: 'D' },
            // Ctrl+Alt+I - Inspect
            { ctrl: true, alt: true, key: 'I' },
            // Ctrl+Alt+J - Console
            { ctrl: true, alt: true, key: 'J' },
            // Ctrl+Alt+C - Inspect
            { ctrl: true, alt: true, key: 'C' },
            // Ctrl+Alt+F - Search
            { ctrl: true, alt: true, key: 'F' },
            // Ctrl+Alt+T - New tab
            { ctrl: true, alt: true, key: 'T' },
            // Ctrl+Alt+R - Reload
            { ctrl: true, alt: true, key: 'R' },
            // Ctrl+Alt+S - Save
            { ctrl: true, alt: true, key: 'S' },
            // Ctrl+Alt+Delete - Task Manager
            { ctrl: true, alt: true, key: 'Delete' },
            // Ctrl+Alt+Esc - Task Manager
            { ctrl: true, alt: true, key: 'Esc' },
            // Ctrl+Alt+M - Mute
            { ctrl: true, alt: true, key: 'M' },
            // Alt+Tab - Switch app
            { alt: true, key: 'Tab' },
            // Alt+F4 - Close window
            { alt: true, key: 'F4' },
            // Alt+ArrowLeft - Back
            { alt: true, key: 'ArrowLeft' },
            // Alt+ArrowRight - Forward
            { alt: true, key: 'ArrowRight' },
            // Alt+Enter - Open in new tab
            { alt: true, key: 'Enter' },
            // Alt+Home - Home
            { alt: true, key: 'Home' },
            // Alt+D - Address bar
            { alt: true, key: 'D' },
            // Alt+F - File menu
            { alt: true, key: 'F' },
            // Alt+E - Edit menu
            { alt: true, key: 'E' },
            // Alt+V - View menu
            { alt: true, key: 'V' },
            // Alt+T - Tools menu
            { alt: true, key: 'T' },
            // Alt+H - Help menu
            { alt: true, key: 'H' },
            // Alt+B - Bookmarks
            { alt: true, key: 'B' },
            // Alt+S - Search
            { alt: true, key: 'S' },
            // Alt+X - Clear
            { alt: true, key: 'X' },
            // Alt+Space - Menu
            { alt: true, key: 'Space' },
            // Windows key (Meta) kombinacije
            { meta: true, key: 'd' },
            { meta: true, key: 'e' },
            { meta: true, key: 'i' },
            { meta: true, key: 'l' },
            { meta: true, key: 'r' },
            { meta: true, key: 's' },
            { meta: true, key: 'x' },
            { meta: true, key: 'q' },
            { meta: true, key: 'u' },
            { meta: true, key: 'p' },
            { meta: true, key: 't' },
            { meta: true, key: 'm' },
            { meta: true, key: 'f' },
            { meta: true, key: 'g' },
            { meta: true, key: 'h' },
            { meta: true, key: 'k' },
            { meta: true, key: 'v' },
            { meta: true, key: 'w' },
            { meta: true, key: 'z' },
            // Mac Command kombinacije
            { meta: true, key: 'Meta' },
            { meta: true, key: 'Alt' },
            { meta: true, key: 'Shift' },
            { meta: true, key: 'Control' },
            { meta: true, key: 'q' },
            { meta: true, key: 'h' },
            { meta: true, key: 'm' },
            { meta: true, key: 'w' },
            { meta: true, key: 'n' },
            { meta: true, key: 'o' },
            { meta: true, key: 's' },
            { meta: true, key: 'p' },
            { meta: true, key: 'c' },
            { meta: true, key: 'v' },
            { meta: true, key: 'x' },
            { meta: true, key: 'a' },
            { meta: true, key: 'z' },
            { meta: true, key: 'Z' },
            { meta: true, key: 'f' },
            { meta: true, key: 'g' },
            { meta: true, key: 't' },
            { meta: true, key: 'T' },
            { meta: true, key: 'l' },
            { meta: true, key: 'L' },
            { meta: true, key: 'd' },
            { meta: true, key: 'D' },
            { meta: true, key: 'b' },
            { meta: true, key: 'B' },
            { meta: true, key: 'i' },
            { meta: true, key: 'I' },
            { meta: true, key: 'j' },
            { meta: true, key: 'J' },
            { meta: true, key: 'k' },
            { meta: true, key: 'K' },
            { meta: true, key: 'r' },
            { meta: true, key: 'R' },
            { meta: true, key: 'u' },
            { meta: true, key: 'U' },
            { meta: true, key: 'e' },
            { meta: true, key: 'E' },
            { meta: true, key: 'y' },
            { meta: true, key: 'Y' }
          ];

          // Preskoči ako je u input polju
          const tag = e.target.tagName.toLowerCase();
          if (tag === 'input' || tag === 'textarea' || tag === 'select' || e.target.isContentEditable) {
            return;
          }

          // Provjeri da li je pritisnuta zabranjena kombinacija
          for (const rule of forbidden) {
            let match = true;
            
            if (rule.ctrl !== undefined && e.ctrlKey !== rule.ctrl) match = false;
            if (rule.shift !== undefined && e.shiftKey !== rule.shift) match = false;
            if (rule.alt !== undefined && e.altKey !== rule.alt) match = false;
            if (rule.meta !== undefined && e.metaKey !== rule.meta) match = false;
            if (rule.key && e.key !== rule.key) match = false;

            if (match) {
              e.preventDefault();
              e.stopPropagation();
              return false;
            }
          }

          // Onemogući F1-F12 (osim F5)
          if (e.key.startsWith('F') && e.key !== 'F5') {
            const num = parseInt(e.key.replace('F', ''));
            if (num >= 1 && num <= 12) {
              e.preventDefault();
              return false;
            }
          }

          // Onemogući Ctrl+W (zatvaranje taba)
          if (e.ctrlKey && e.key === 'w') {
            e.preventDefault();
            return false;
          }

          // Onemogući Ctrl+Tab (switch tab)
          if (e.ctrlKey && e.key === 'Tab') {
            e.preventDefault();
            return false;
          }
        });

        // ============================================================
        // 3. ONEMOGUĆI SREDNJI KLIK (svi elementi)
        // ============================================================
        document.addEventListener('mousedown', function(e) {
          if (e.button === 1) {
            e.preventDefault();
            return false;
          }
        });

        // ============================================================
        // 4. ONEMOGUĆI DRAG AND DROP
        // ============================================================
        document.addEventListener('dragstart', function(e) {
          e.preventDefault();
          return false;
        });

        // ============================================================
        // 5. ONEMOGUĆI SELECTION (tekst)
        // ============================================================
        document.addEventListener('selectstart', function(e) {
          const tag = e.target.tagName.toLowerCase();
          if (tag !== 'input' && tag !== 'textarea') {
            e.preventDefault();
            return false;
          }
        });

        // ============================================================
        // 6. ONEMOGUĆI PRINT
        // ============================================================
        window.addEventListener('beforeprint', function(e) {
          e.preventDefault();
          alert('🛡️ Printanje je onemogućeno!');
          return false;
        });

        // ============================================================
        // 7. ONEMOGUĆI SVE ŠTO SE ODNOSI NA COPY/PASTE
        // ============================================================
        document.addEventListener('copy', function(e) {
          e.preventDefault();
          return false;
        });

        document.addEventListener('cut', function(e) {
          e.preventDefault();
          return false;
        });

        // ============================================================
        // 8. DEVTOOLS DETEKCIJA
        // ============================================================
        (function detectDevTools() {
          const element = new Image();
          Object.defineProperty(element, 'id', {
            get: function() {
              console.warn('🔍 DevTools detektovani!');
            }
          });
          console.log('%c', element);
        })();

        // ============================================================
        // 9. ZAŠTITA SLIKA
        // ============================================================
        document.addEventListener('mousedown', function(e) {
          if (e.target.tagName === 'IMG') {
            e.preventDefault();
            return false;
          }
        });

        // ============================================================
        // 10. TOUCH ZAŠTITA (mobile)
        // ============================================================
        document.addEventListener('touchstart', function(e) {
          if (e.target.tagName === 'IMG') {
            e.preventDefault();
            return false;
          }
        });

        // ============================================================
        // 11. CSS ZAŠTITA
        // ============================================================
        const style = document.createElement('style');
        style.textContent = `
          /* Onemogući selektovanje teksta */
          body {
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
          }
          
          /* Dozvoli selektovanje u input poljima */
          input, textarea, select, [contenteditable="true"] {
            -webkit-user-select: text;
            -moz-user-select: text;
            -ms-user-select: text;
            user-select: text;
          }
          
          /* Onemogući drag na slikama */
          img {
            -webkit-user-drag: none;
            user-drag: none;
            -webkit-touch-callout: none;
          }
          
          /* Onemogući long-press na mobilnim */
          * {
            -webkit-touch-callout: none;
          }
        `;
        document.head.appendChild(style);

        console.log('✅ Potpuna zaštita aktivirana!');
        console.log('🛡️ Onemogućeni: desni klik, sve prečice, DevTools, print, copy, cut, drag, selection.');
      })();
    </script>

    <!-- Service Worker registracija -->
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/service-worker.js')
          .then(() => console.log('✅ Service Worker registrovan'))
          .catch(err => console.log('❌ Greška pri registraciji Service Worker-a:', err));
      }
