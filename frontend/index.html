<!doctype html>
<html lang="hr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#2563eb" />
    <meta name="description" content="OS Zdravlja – Operativni sistem za tvoje zdravlje. Recepti, AI, personalizacija i zdravlje na jednom mjestu." />
    <title>OS Zdravlja – Operativni sistem za tvoje zdravlje</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    
    <!-- Service Worker registracija -->
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/service-worker.js')
          .then(() => console.log('✅ Service Worker registrovan'))
          .catch(err => console.log('❌ Greška pri registraciji Service Worker-a:', err));
      }
    </script>
  </body>
</html>
