<!DOCTYPE html>
<html lang="hr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OS Zdravlja – Offline</title>
  <style>
    body {
      background: #1a1a2e;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: sans-serif;
      text-align: center;
      padding: 20px;
    }
    .offline-box {
      max-width: 400px;
    }
    .offline-box h1 {
      font-size: 48px;
    }
    .offline-box p {
      color: #aaa;
    }
  </style>
</head>
<body>
  <div class="offline-box">
    <h1>📡</h1>
    <h2>Nema interneta</h2>
    <p>Molimo provjerite svoju internet vezu i pokušajte ponovo.</p>
    <button onclick="location.reload()" style="background:#e94560;color:#fff;border:none;padding:10px 20px;border-radius:8px;cursor:pointer;margin-top:20px;">
      🔄 Pokušaj ponovo
    </button>
  </div>
</body>
</html>
